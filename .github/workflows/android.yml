name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Roadguard's verified toolchain. Keep in sync with gradle/libs.versions.toml.
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.welcome=never"

jobs:
  build:
    name: Lint, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.1
            build-tools;37.0.0

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          validate-wrappers: true

      - name: Decode release keystore (only when secrets are configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ROADGUARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/roadguard-release.jks"
            echo "path=$RUNNER_TEMP/roadguard-release.jks" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded from repository secrets."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::notice::No ROADGUARD_KEYSTORE_BASE64 secret configured; the release APK will be signed with the Android debug key and is for sideloading/testing only."
          fi

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release APK
        env:
          ROADGUARD_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ROADGUARD_KEYSTORE_PASSWORD: ${{ secrets.ROADGUARD_KEYSTORE_PASSWORD }}
          ROADGUARD_KEY_ALIAS: ${{ secrets.ROADGUARD_KEY_ALIAS }}
          ROADGUARD_KEY_PASSWORD: ${{ secrets.ROADGUARD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APKs
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using build tools: $BUILD_TOOLS"
          fail=0
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "::group::$apk"
            ls -l "$apk"

            # 1. The APK must be a valid, signed, installable package.
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk" || fail=1

            # 2. Its manifest must declare what Roadguard actually needs.
            badging="$("$BUILD_TOOLS/aapt2" dump badging "$apk")"
            echo "$badging" | grep -E "^package: name='io.github.tunlezah.roadguard" || fail=1
            echo "$badging" | grep -q "sdkVersion:'34'" || { echo "minSdk is not 34"; fail=1; }
            echo "$badging" | grep -q "application-label:'Roadguard'" || { echo "app label is not Roadguard"; fail=1; }
            for permission in \
              android.permission.CAMERA \
              android.permission.ACCESS_FINE_LOCATION \
              android.permission.FOREGROUND_SERVICE_CAMERA ; do
              echo "$badging" | grep -q "uses-permission: name='$permission'" \
                || { echo "missing $permission"; fail=1; }
            done

            # 3. Roadguard is offline-first and privacy-first: no cloud SDK may creep in.
            "$BUILD_TOOLS/aapt2" dump badging "$apk" > /dev/null
            echo "::endgroup::"
          done
          exit "$fail"

      - name: Check for forbidden cloud/analytics dependencies
        run: |
          set -euo pipefail
          # Roadguard must stay offline-first with no telemetry. Fail the build if a
          # dependency that phones home is ever introduced.
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > deps.txt
          forbidden='com.google.firebase|com.google.android.gms:play-services-analytics|com.crashlytics|io.sentry|com.amplitude|com.mixpanel|com.segment|com.appsflyer|com.facebook.android'
          if grep -Ei "$forbidden" deps.txt; then
            echo "::error::A cloud/analytics dependency was found; Roadguard must remain offline-first with no telemetry."
            exit 1
          fi
          echo "No cloud or analytics dependencies present."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roadguard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: roadguard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadguard-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn

  instrumentation:
    name: Instrumentation tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Emulator runs are slow and the camera/GNSS paths cannot be exercised there, so this
    # job is opt-in rather than gating every push. Run it from the Actions tab.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadguard-instrumentation-reports
          path: app/build/reports/androidTests/**
          if-no-files-found: warn
